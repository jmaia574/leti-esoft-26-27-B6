<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="780px" preserveAspectRatio="none" style="width:722px;height:780px;background:#FFFFFF;" version="1.1" viewBox="0 0 722 780" width="722px" zoomAndPan="magnify"><title>US11 - Register Parameter</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="192.8008" x="260.8496" y="23.5352">US11 - Register Parameter</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="142.6934" x="285.9033" y="40.0234">Domain Model (DM)</text><!--class Administrator--><g id="elem_Administrator"><rect codeLine="15" fill="#EFF6FF" height="34.4883" id="Administrator" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="99.7207" x="6" y="292.4766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.7207" x="9" y="311.0117">Administrator</text><line style="stroke:#2563EB;stroke-width:0.5;" x1="7" x2="104.7207" y1="318.9648" y2="318.9648"/></g><!--class Parameter--><g id="elem_Parameter"><rect codeLine="17" fill="#EFF6FF" height="116.9297" id="Parameter" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="88.0771" x="148" y="468.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.5645" x="157.7563" y="487.5117">Parameter</text><line style="stroke:#2563EB;stroke-width:0.5;" x1="149" x2="235.0771" y1="495.4648" y2="495.4648"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="14.5195" x="154" y="513">ID</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="37.29" x="154" y="529.4883">name</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="76.0771" x="154" y="545.9766">description</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="43.0527" x="154" y="562.4648">metric</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="75.8311" x="154" y="578.9531">metricType</text></g><!--class ReferenceRange--><g id="elem_ReferenceRange"><rect codeLine="25" fill="#EFF6FF" height="67.4648" id="ReferenceRange" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="114.5889" x="134.5" y="673.4766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.5889" x="137.5" y="692.0117">ReferenceRange</text><line style="stroke:#2563EB;stroke-width:0.5;" x1="135.5" x2="248.0889" y1="699.9648" y2="699.9648"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="64.6816" x="140.5" y="717.5">minimum</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.2637" x="140.5" y="733.9883">maximum</text></g><!--class TestType--><g id="elem_TestType"><rect codeLine="30" fill="#EFF6FF" height="83.9531" id="TestType" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="206.3525" x="89" y="65.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="61.8037" x="161.2744" y="84.5117">TestType</text><line style="stroke:#2563EB;stroke-width:0.5;" x1="90" x2="294.3525" y1="92.4648" y2="92.4648"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="86.8643" x="95" y="110">internalCode</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="59.4111" x="95" y="126.4883">nhsCode</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="194.3525" x="95" y="142.9766">collectionMethodDescription</text></g><!--class TestTypeParameter--><g id="elem_TestTypeParameter"><rect codeLine="36" fill="#EFF6FF" height="34.4883" id="TestTypeParameter" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="136.3682" x="124" y="292.4766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="130.3682" x="127" y="311.0117">TestTypeParameter</text><line style="stroke:#2563EB;stroke-width:0.5;" x1="125" x2="259.3682" y1="318.9648" y2="318.9648"/></g><g id="elem_GMN11"><path d="M496.5,204.9766 L496.5,404.8484 L236.0734,474.9181 L496.5,412.8484 L496.5,414.0137 A0,0 0 0 0 496.5,414.0137 L715.2803,414.0137 A0,0 0 0 0 715.2803,414.0137 L715.2803,214.9766 L705.2803,204.9766 L496.5,204.9766 A0,0 0 0 0 496.5,204.9766 " fill="#FFF7ED" style="stroke:#F59E0B;stroke-width:0.5;"/><path d="M705.2803,204.9766 L705.2803,214.9766 L715.2803,214.9766 L705.2803,204.9766 " fill="#FFF7ED" style="stroke:#F59E0B;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="50.1465" x="502.5" y="222.5449">AC11-1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="502.5" y="237.8555">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.5112" x="502.5" y="253.166">Each Parameter has a unique</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.3071" x="502.5" y="268.4766">ID containing exactly five</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.958" x="502.5" y="283.7871">alphanumeric characters.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="502.5" y="299.0977">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="50.1465" x="502.5" y="314.4082">AC11-2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="502.5" y="329.7188">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.7803" x="502.5" y="345.0293">Reference values are applicable</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.7593" x="502.5" y="360.3398">only to numeric metrics.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="502.5" y="375.6504">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.7246" x="502.5" y="390.9609">For Numeric, both bounds</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.6719" x="502.5" y="406.2715">are mandatory.</text></g><g id="elem_GMN14"><path d="M254,468.9766 L254,523.4766 L236.2637,527.4766 L254,531.4766 L254,586.1504 A0,0 0 0 0 254,586.1504 L476.0049,586.1504 A0,0 0 0 0 476.0049,586.1504 L476.0049,478.9766 L466.0049,468.9766 L254,468.9766 A0,0 0 0 0 254,468.9766 " fill="#FFF7ED" style="stroke:#F59E0B;stroke-width:0.5;"/><path d="M466.0049,468.9766 L466.0049,478.9766 L476.0049,478.9766 L466.0049,468.9766 " fill="#FFF7ED" style="stroke:#F59E0B;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.9209" x="260" y="486.5449">Metric classification:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="260" y="501.8555">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.7871" x="260" y="517.166">Numeric</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="67.4946" x="260" y="532.4766">Qualitative</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="260" y="547.7871">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.502" x="260" y="563.0977">Represented in the CD</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.0049" x="260" y="578.4082">by the MetricType enumeration.</text></g><g id="elem_GMN17"><path d="M268,640.9766 L268,702.9766 L249.6563,706.9766 L268,710.9766 L268,773.4609 A0,0 0 0 0 268,773.4609 L476.0718,773.4609 A0,0 0 0 0 476.0718,773.4609 L476.0718,650.9766 L466.0718,640.9766 L268,640.9766 A0,0 0 0 0 268,640.9766 " fill="#FFF7ED" style="stroke:#F59E0B;stroke-width:0.5;"/><path d="M466.0718,640.9766 L466.0718,650.9766 L476.0718,650.9766 L466.0718,640.9766 " fill="#FFF7ED" style="stroke:#F59E0B;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.6772" x="274" y="658.5449">Numeric parameter:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.2451" x="274" y="673.8555">exactly one reference range,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.0718" x="274" y="689.166">with both bounds mandatory.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="274" y="704.4766">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.3848" x="274" y="719.7871">Qualitative parameter:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.4238" x="274" y="735.0977">no reference range.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="274" y="750.4082">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.457" x="274" y="765.7188">minimum &lt;= maximum.</text></g><g id="elem_GMN20"><path d="M278,265.9766 L278,305.4766 L260.2969,309.4766 L278,313.4766 L278,352.5293 A0,0 0 0 0 278,352.5293 L477.7627,352.5293 A0,0 0 0 0 477.7627,352.5293 L477.7627,275.9766 L467.7627,265.9766 L278,265.9766 A0,0 0 0 0 278,265.9766 " fill="#FFF7ED" style="stroke:#F59E0B;stroke-width:0.5;"/><path d="M467.7627,265.9766 L467.7627,275.9766 L477.7627,275.9766 L467.7627,265.9766 " fill="#FFF7ED" style="stroke:#F59E0B;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.063" x="284" y="283.5449">Associates test types</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.585" x="284" y="298.8555">with their parameters.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="284" y="314.166">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.4121" x="284" y="329.4766">This concept already exists</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.7627" x="284" y="344.7871">in the global Domain Model.</text></g><path d="M62.8595,326.7341 C74.5186,353.6156 99.7063,408.5684 128,450.9766 C134.0081,459.9818 140.935,469.1272 147.9647,477.7984 " fill="none" style="stroke:#2563EB;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="56.5386" x="130" y="446.5449">manages</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="22.7119" x="124.9647" y="474.3668">0..*</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="8.2202" x="53.8595" y="340.3025">1</text><path d="M192,586.1057 C192,615.057 192,649.0672 192,673.451 " fill="none" style="stroke:#2563EB;stroke-width:1;"/><text fill="#000000" fon