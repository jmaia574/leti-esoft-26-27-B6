<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="884px" preserveAspectRatio="none" style="width:622px;height:884px;background:#FFFFFF;" version="1.1" viewBox="0 0 622 884" width="622px" zoomAndPan="magnify"><title>US11 - Register Parameter</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="192.8008" x="211.0996" y="23.5352">US11 - Register Parameter</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="142.6934" x="236.1533" y="40.0234">Domain Model (DM)</text><!--class Administrator--><g id="elem_Administrator"><rect codeLine="21" fill="#EFF6FF" height="34.4883" id="Administrator" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="99.7207" x="6" y="246.4766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.7207" x="9" y="265.0117">Administrator</text><line style="stroke:#2563EB;stroke-width:0.5;" x1="7" x2="104.7207" y1="272.9648" y2="272.9648"/></g><!--class Parameter--><g id="elem_Parameter"><rect codeLine="23" fill="#EFF6FF" height="116.9297" id="Parameter" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="88.0771" x="72" y="422.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.5645" x="81.7563" y="441.5117">Parameter</text><line style="stroke:#2563EB;stroke-width:0.5;" x1="73" x2="159.0771" y1="449.4648" y2="449.4648"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="32.3818" x="78" y="467">code</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="37.29" x="78" y="483.4883">name</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="76.0771" x="78" y="499.9766">description</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="43.0527" x="78" y="516.4648">metric</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="75.8311" x="78" y="532.9531">metricType</text></g><!--class ReferenceRange--><g id="elem_ReferenceRange"><rect codeLine="31" fill="#EFF6FF" height="67.4648" id="ReferenceRange" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="114.5889" x="58.5" y="640.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.5889" x="61.5" y="659.5117">ReferenceRange</text><line style="stroke:#2563EB;stroke-width:0.5;" x1="59.5" x2="172.0889" y1="667.4648" y2="667.4648"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="64.6816" x="64.5" y="685">minimum</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.2637" x="64.5" y="701.4883">maximum</text></g><!--class TestType--><g id="elem_TestType"><rect codeLine="36" fill="#EFF6FF" height="83.9531" id="TestType" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="206.3525" x="341" y="65.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="61.8037" x="413.2744" y="84.5117">TestType</text><line style="stroke:#2563EB;stroke-width:0.5;" x1="342" x2="546.3525" y1="92.4648" y2="92.4648"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="86.8643" x="347" y="110">internalCode</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="59.4111" x="347" y="126.4883">nhsCode</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="194.3525" x="347" y="142.9766">collectionMethodDescription</text></g><!--class TestTypeParameter--><g id="elem_TestTypeParameter"><rect codeLine="42" fill="#EFF6FF" height="34.4883" id="TestTypeParameter" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="136.3682" x="376" y="246.4766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="130.3682" x="379" y="265.0117">TestTypeParameter</text><line style="stroke:#2563EB;stroke-width:0.5;" x1="377" x2="511.3682" y1="272.9648" y2="272.9648"/></g><g id="elem_GMN11"><path d="M178.5,376.9766 L178.5,477.4766 L160.0078,481.4766 L178.5,485.4766 L178.5,586.0137 A0,0 0 0 0 178.5,586.0137 L397.2803,586.0137 A0,0 0 0 0 397.2803,586.0137 L397.2803,386.9766 L387.2803,376.9766 L178.5,376.9766 A0,0 0 0 0 178.5,376.9766 " fill="#FFF9E6" style="stroke:#181818;stroke-width:0.5;"/><path d="M387.2803,376.9766 L387.2803,386.9766 L397.2803,386.9766 L387.2803,376.9766 " fill="#FFF9E6" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="50.1465" x="184.5" y="394.5449">AC11-1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="184.5" y="409.8555">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.5078" x="184.5" y="425.166">Each parameter has a unique</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.8936" x="184.5" y="440.4766">code containing exactly five</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.958" x="184.5" y="455.7871">alphanumeric characters.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="184.5" y="471.0977">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="50.1465" x="184.5" y="486.4082">AC11-2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="184.5" y="501.7188">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.7803" x="184.5" y="517.0293">Reference values are applicable</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.7593" x="184.5" y="532.3398">only to numeric metrics.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="184.5" y="547.6504">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.7246" x="184.5" y="562.9609">For Numeric, both bounds</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.6719" x="184.5" y="578.2715">are mandatory.</text></g><g id="elem_GMN14"><path d="M12,744.9766 L12,877.4609 A0,0 0 0 0 12,877.4609 L220.0718,877.4609 A0,0 0 0 0 220.0718,877.4609 L220.0718,754.9766 L210.0718,744.9766 L120,744.9766 L116,708.0353 L112,744.9766 L12,744.9766 A0,0 0 0 0 12,744.9766 " fill="#FFF9E6" style="stroke:#181818;stroke-width:0.5;"/><path d="M210.0718,744.9766 L210.0718,754.9766 L220.0718,754.9766 L210.0718,744.9766 " fill="#FFF9E6" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.6772" x="18" y="762.5449">Numeric parameter:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.2451" x="18" y="777.8555">exactly one reference range,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.0718" x="18" y="793.166">with both bounds mandatory.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="18" y="808.4766">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.3848" x="18" y="823.7871">Qualitative parameter:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.4238" x="18" y="839.0977">no reference range.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="18" y="854.4082">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.457" x="18" y="869.7188">minimum &lt;= maximum.</text></g><g id="elem_GMN17"><path d="M416,437.9766 L416,524.5293 A0,0 0 0 0 416,524.5293 L615.7627,524.5293 A0,0 0 0 0 615.7627,524.5293 L615.7627,447.9766 L605.7627,437.9766 L505.6998,437.9766 L449.4117,280.7117 L497.6998,437.9766 L416,437.9766 A0,0 0 0 0 416,437.9766 " fill="#FFF9E6" style="stroke:#181818;stroke-width:0.5;"/><path d="M605.7627,437.9766 L605.7627,447.9766 L615.7627,447.9766 L605.7627,437.9766 " fill="#FFF9E6" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.063" x="422" y="455.5449">Associates test types</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.585" x="422" y="470.8555">with their parameters.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="422" y="486.166">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.4121" x="422" y="501.4766">This concept already exists</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.7627" x="422" y="516.7871">in the global Domain Model.</text></g><g id="elem_GMN20"><path d="M124,204.9766 L124,322.1504 A0,0 0 0 0 124,322.1504 L196.2747,322.1504 L144.716,422.9562 L204.2747,322.1504 L346.0049,322.1504 A0,0 0 0 0 346.0049,322.1504 L346.0049,214.9766 L336.0049,204.9766 L124,204.9766 A0,0 0 0 0 124,204.9766 " fill="#FFF9E6" style="stroke:#181818;stroke-width:0.5;"/><path d="M336.0049,204.9766 L336.0049,214.9766 L346.0049,214.9766 L336.0049,204.9766 " fill="#FFF9E6" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.9209" x="130" y="222.5449">Metric classification:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="130" y="237.8555">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.7871" x="130" y="253.166">Numeric</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="67.4946" x="130" y="268.4766">Qualitative</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="130" y="283.7871">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.502" x="130" y="299.0977">Represented in the CD</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.0049" x="130" y="314.4082">by the MetricType enumeration.</text></g><path d="M60.5098,280.7117 C68.7675,310.4396 86.6854,374.9441 99.9377,422.6524 " fill="none" style="stroke:#475569;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="56.5386" x="83" y="354.5449">manages</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="22.7119" x="76.9377" y="419.2208">0..*</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="22.7119" x="37.5098" y="294.28">0..*</text><path d="M116,540.0419 C116,572.9942 116,613.1417 116,640.7392 " fill="none" style="stroke:#475569;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="sp