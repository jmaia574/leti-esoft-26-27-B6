-width:1;" x1="305" x2="574.4375" y1="291.4648" y2="291.4648"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="158.5732" x="310" y="309">+add(parameter) : bool</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="259.4375" x="310" y="325.4883">+findByCode(code) : const Parameter*</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="186.1699" x="310" y="341.9766">+existsByCode(code) : bool</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="111.1523" x="310" y="358.4648">+count() : size_t</text></g><!--class RegisterParameter--><g id="elem_RegisterParameter"><rect codeLine="49" fill="#EFF6FF" height="113.9531" id="RegisterParameter" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="579.3965" x="6" y="65.9766"/><ellipse cx="229.501" cy="81.9766" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M232.4741,87.6196 Q231.8931,87.9185 231.2539,88.0679 Q230.6147,88.2173 229.9092,88.2173 Q227.4023,88.2173 226.0825,86.5654 Q224.7627,84.9136 224.7627,81.7925 Q224.7627,78.6631 226.0825,77.0112 Q227.4023,75.3594 229.9092,75.3594 Q230.6147,75.3594 231.2622,75.5088 Q231.9097,75.6582 232.4741,75.957 L232.4741,78.6797 Q231.8433,78.0986 231.2498,77.8289 Q230.6563,77.5591 230.0254,77.5591 Q228.6807,77.5591 227.9958,78.6257 Q227.311,79.6924 227.311,81.7925 Q227.311,83.8843 227.9958,84.9509 Q228.6807,86.0176 230.0254,86.0176 Q230.6563,86.0176 231.2498,85.7478 Q231.8433,85.478 232.4741,84.897 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="123.8945" x="250.001" y="87.2676">RegisterParameter</text><line style="stroke:#2563EB;stroke-width:0.5;" x1="7" x2="584.3965" y1="97.9766" y2="97.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="240.8438" x="12" y="115.5117">-repository : ParameterRepository&amp;</text><line style="stroke:#2563EB;stroke-width:1;" x1="7" x2="584.3965" y1="122.4648" y2="122.4648"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="213.1309" x="12" y="140">+RegisterParameter(repository)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="567.3965" x="12" y="156.4883">+execute(code, name, description, metric, metricType, minimum, maximum) : bool</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="482.7061" x="12" y="172.9766">+execute(code, name, description, metric, minimum, maximum) : bool</text></g><g id="elem_GMN10"><path d="M590,488.4766 L590,596.4766 L571.7754,600.4766 L590,604.4766 L590,712.8242 A0,0 0 0 0 590,712.8242 L806.6411,712.8242 A0,0 0 0 0 806.6411,712.8242 L806.6411,498.4766 L796.6411,488.4766 L590,488.4766 A0,0 0 0 0 590,488.4766 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M796.6411,488.4766 L796.6411,498.4766 L806.6411,498.4766 L796.6411,488.4766 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="54.2598" x="596" y="506.0449">AC11-1:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.4829" x="596" y="521.3555">Code must contain exactly</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.2915" x="596" y="536.666">5 alphanumeric characters.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="596" y="551.9766">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="54.2598" x="596" y="567.2871">AC11-2:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.75" x="596" y="582.5977">Numeric metrics require</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.4292" x="596" y="597.9082">both minimum and maximum.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="596" y="613.2188">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.0483" x="596" y="628.5293">Qualitative metrics must not</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.6411" x="596" y="643.8398">have numeric reference values.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="596" y="659.1504">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.71" x="596" y="674.4609">optional&lt;double&gt; represents</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.5483" x="596" y="689.7715">absence for Qualitative and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.6108" x="596" y="705.082">legacy C++ compatibility.</text></g><polygon fill="#475569" points="295.5,835.5797,299.5,826.5797,295.5,830.5797,291.5,826.5797,295.5,835.5797" style="stroke:#475569;stroke-width:1;"/><path d="M295.5,781.1813 C295.5,801.3555 295.5,814.1569 295.5,829.5797 " fill="none" style="stroke:#475569;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="28.5645" x="297.5" y="813.5449">uses</text><polygon fill="none" points="408.6084,365.0123,402.3987,368.6784,403.3944,375.8204,409.6041,372.1543,408.6084,365.0123" style="stroke:#475569;stroke-width:1;"/><path d="M403.3944,375.8204 C395.3783,392.4372 391.5537,400.3651 382.168,419.8211 " fill="n