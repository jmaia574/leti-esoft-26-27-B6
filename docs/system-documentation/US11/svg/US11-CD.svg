91.4648" y2="291.4648"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="158.5732" x="305.5" y="309">+add(parameter) : bool</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="221.1973" x="305.5" y="325.4883">+findByID(ID) : const Parameter*</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.9297" x="305.5" y="341.9766">+existsByID(ID) : bool</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="111.1523" x="305.5" y="358.4648">+count() : size_t</text></g><!--class RegisterParameter--><g id="elem_RegisterParameter"><rect codeLine="49" fill="#EFF6FF" height="113.9531" id="RegisterParameter" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="561.5342" x="6" y="65.9766"/><ellipse cx="220.5698" cy="81.9766" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M223.543,87.6196 Q222.9619,87.9185 222.3228,88.0679 Q221.6836,88.2173 220.978,88.2173 Q218.4712,88.2173 217.1514,86.5654 Q215.8315,84.9136 215.8315,81.7925 Q215.8315,78.6631 217.1514,77.0112 Q218.4712,75.3594 220.978,75.3594 Q221.6836,75.3594 222.3311,75.5088 Q222.9785,75.6582 223.543,75.957 L223.543,78.6797 Q222.9121,78.0986 222.3186,77.8289 Q221.7251,77.5591 221.0942,77.5591 Q219.7495,77.5591 219.0647,78.6257 Q218.3799,79.6924 218.3799,81.7925 Q218.3799,83.8843 219.0647,84.9509 Q219.7495,86.0176 221.0942,86.0176 Q221.7251,86.0176 222.3186,85.7478 Q222.9121,85.478 223.543,84.897 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="123.8945" x="241.0698" y="87.2676">RegisterParameter</text><line style="stroke:#2563EB;stroke-width:0.5;" x1="7" x2="566.5342" y1="97.9766" y2="97.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="240.8438" x="12" y="115.5117">-repository : ParameterRepository&amp;</text><line style="stroke:#2563EB;stroke-width:1;" x1="7" x2="566.5342" y1="122.4648" y2="122.4648"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="213.1309" x="12" y="140">+RegisterParameter(repository)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="549.5342" x="12" y="156.4883">+execute(ID, name, description, metric, metricType, minimum, maximum) : bool</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="464.8438" x="12" y="172.9766">+execute(ID, name, description, metric, minimum, maximum) : bool</text></g><g id="elem_GMN10"><path d="M572.5,434.4766 L572.5,596.4766 L554.0273,600.4766 L572.5,604.4766 L572.5,765.998 A0,0 0 0 0 572.5,765.998 L789.1411,765.998 A0,0 0 0 0 789.1411,765.998 L789.1411,444.4766 L779.1411,434.4766 L572.5,434.4766 A0,0 0 0 0 572.5,434.4766 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M779.1411,434.4766 L779.1411,444.4766 L789.1411,444.4766 L779.1411,434.4766 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="54.2598" x="578.5" y="452.0449">AC11-1:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.7622" x="578.5" y="467.3555">Parameter ID must contain</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.5293" x="578.5" y="482.666">exactly 5 alphanumeric</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.8076" x="578.5" y="497.9766">characters and be unique.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="578.5" y="513.2871">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="54.2598" x="578.5" y="528.5977">AC11-2:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.3037" x="578.5" y="543.9082">Reference values are only</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.2358" x="578.5" y="559.2188">applicable to numeric metrics.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="578.5" y="574.5293">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.75" x="578.5" y="589.8398">Numeric metrics require</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.3159" x="578.5" y="605.1504">both minimum and maximum</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.9453" x="578.5" y="620.4609">reference values.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="578.5" y="635.7715">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.0483" x="578.5" y="651.082">Qualitative metrics must not</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.6411" x="578.5" y="666.3926">have numeric reference values.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="578.5" y="681.7031">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.3438" x="578.5" y="697.0137">minimum &lt;= maximum</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="578.5" y="712.3242">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.71" x="578.5" y="727.6348">optional&lt;double&gt; represents</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.5483" x="578.5" y="742.9453">absence for Qualitative and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.6108" x="578.5" y="758.2559">legacy C++ compatibility.</text></g><polygon fill="#475569" points="287,835.5797,291,826.5797,287,830.5797,283,826.5797,287,835.5797" style="stroke:#475569;stroke-width:1;"/><path d="M287,781.1813 C287,801.3555 287,814.1569 287,829.5797 " fill="none" style="stroke:#475569;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="28.5645" x="289" y="813.5449">uses</text><polygon fill="none" points="392.2536,365.0123,386.1472,368.8479,387.3392,375.9598,393.4456,372.1242,392.2536,365.0123" style="stroke:#475569;stroke-width:1;"/><path d="M387.3392,375.9598 C379.8797,392.5766 376.3833,400.3651 367.6494,419.8211 " fill="none" style="stroke:#475569;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="38.6636" x="383" y="397.5449">stores</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="22.7119" x="344.6494" y="416.3895">0..*</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="8.2202" x="383.2536" y="378.5807">1</text><polygon fill="#475569" points="371.8909,234.8416,369.5952,225.264,368.8512,230.8717,363.2435,230.1277,371.8909,234.8416" style="stroke:#475569;stroke-width:1;"/><path d="M330.136,180.3109 C343.4486,197.6967 354.5592,212.2069 368.2432,230.0778 " fill="none" style="stroke:#475569;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="28.5645" x="360" y="212.5449">uses</text><polygon fill="#475569" points="242.372,419.7841,245.