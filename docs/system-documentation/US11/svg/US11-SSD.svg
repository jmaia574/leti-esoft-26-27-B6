.3037" x="377" y="810.8828">Reference values are only</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.2358" x="377" y="826.1934">applicable to numeric metrics.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="377" y="841.5039">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.9209" x="377" y="856.8145">Metric classification:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.9263" x="377" y="872.125">Numeric or Qualitative.</text><!--SRC=[fLJVRzem47xtNt7g7hP9PHBjO2hI9W5jfMgZwvfrJxmOvnAiEdPcEr3- -vsT8D8KAjJb8Khi-_7TTz-TbruXF2JzFlJW7dFfF5guuvONI5zpdMpef804_rQe1SAbv3bTmeSakVp8c7kKkWpMiE3YCRUcqkdKA6FXtNLyMXPkoLEpbZg7Z2k7xPic-WoTupcEbSmr2DI4e6LbqPL6kwtL19LPZwqrQ_2sQeSZ-5uAMNBj9yQcQ1j4PuFX-TNaW64N_jNrzV0P_B7mnZwBTtx-kJyOj4q2ckRoyvV1O7ZHkhmr7YTxIBgu6ZB6Gt0u6QU5rDG3o-dt1BY3UCBA7L0uUVZ-Wo_SB8dtTNyOUmzVt_AGtunB3Kab1D4A2R7EhJHlZiSYOEXzQv31Y6H5tNNUGRcL5RKohwkKHZFMMFR8gVRUwoDrPcpHkBpCScVDIgReG9WKJq6JrodGlx2o33wdSqrnh1J0TGhDfr3SEPb9SGGI4yDmHU0pj74OLbpHtQjekiO4Oxr43Rmi5QLTAAJcAmz_k99fkyO8izAIiiUI60DwzW2S6fr9MpXmTG-pIXra6cdku4QlOh8G5Ufy1uFVH40E_99xUjLGeAYSfo_jIJfpZK-aNhM1JAuGk2gNN5S5HdgNX4CG3DUalgnYrHvR25yjxaN-vtvp6XPAQP6dcwPKOZjjijrtk2TwXIbAue9eXxNqowqE_AOy4aEtdy0jeJ2QwkUA5XAcWLBOCb37TntcTq5as75qU3m1OK4KLR6BCTSH2GYkjV60Jm89H3JbJy6qIVwJZi8KhRfAEpvtMqnpuh9IAOISYw2BebJKby2zJlzd7ur9nQNdWPsfbKIFv6_VHeIEOCjywS5assKvdlRxlVw8_NwXfwXirYWRsi9cXuGTjqcO1oAX7jTFhCvmDcBtUzG2GIniD__WJLSk566sRq6Ds6rZI1BxLL4ZFPslA2Dn7Zg1x1y0]--></g></svg>