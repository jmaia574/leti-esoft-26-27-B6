="30.4883" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="83.583" x="324.9419" y="103.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="69.583" x="331.9419" y="124.5117">UKLabsMS</text><rect fill="#EFF6FF" height="30.4883" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="83.583" x="324.9419" y="893.8672"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="69.583" x="331.9419" y="914.4023">UKLabsMS</text><polygon fill="#475569" points="354.7334,162.7754,364.7334,166.7754,354.7334,170.7754,358.7334,166.7754" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="69.8604" x2="360.7334" y1="166.7754" y2="166.7754"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.0488" x="116.7725" y="162.0332">Requests parameter registration</text><polygon fill="#475569" points="80.8604,192.0859,70.8604,196.0859,80.8604,200.0859,76.8604,196.0859" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="74.8604" x2="365.7334" y1="196.0859" y2="196.0859"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.8613" x="116.3662" y="191.3438">Requests parameter information</text><polygon fill="#475569" points="354.7334,236.707,364.7334,240.707,354.7334,244.707,358.7334,240.707" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="69.8604" x2="360.7334" y1="240.707" y2="240.707"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.0464" x="111.7737" y="220.6543">Provides code, name, description,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.3804" x="119.6067" y="235.9648">metric and metric classification</text><polygon fill="#475569" points="80.8604,266.0176,70.8604,270.0176,80.8604,274.0176,76.8604,270.0176" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="74.8604" x2="365.7334" y1="270.0176" y2="270.0176"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.9082" x="108.3428" y="265.2754">Requests optional reference values</text><polygon fill="#475569" points="354.7334,310.6387,364.7334,314.6387,354.7334,318.6387,358.7334,314.6387" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="69.8604" x2="360.7334" y1="314.6387" y2="314.6387"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.0869" x="136.2534" y="294.5859">Provides reference values,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.5879" x="167.5029" y="309.8965">when applicable</text><path d="M10,329.6387 L72.1387,329.6387 L72.1387,336.9492 L62.1387,346.9492 L10,346.9492 L10,329.6387 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="344.502" style="stroke:#000000;stroke-width:1.5;" width="408.5249" x="10" y="329.6387"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1387" x="25" y="343.207">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="204.6333" x="87.1387" y="342.2734">[Valid information and unique code]</text><polygon fill="#475569" points="80.8604,364.2598,70.8604,368.2598,80.8604,372.2598,76.8604,368.2598" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="74.8604" x2="365.7334" y1="368.2598" y2="368.2598"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.873" x="81.8604" y="363.5176">Confirms successful parameter registration</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="10" x2="418.5249" y1="377.2598" y2="377.2598"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="118.5024" x="15" y="387.8945">[Invalid code format]</text><polygon fill="#475569" points="80.8604,423.8359,70.8604,427.8359,80.8604,431.8359,76.8604,427.8359" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="74.8604" x2="365.7334" y1="427.8359" y2="427.8359"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.7139" x="106.9399" y="407.7832">Informs that the code must contain</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.0454" x="103.2742" y="423.0938">exactly five alphanumeric characters</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="10" x2="418.5249" y1="436.8359" y2="436.8359"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="153.8711" x="15" y="447.4707">[Duplicate parameter code]</text><polygon fill="#475569" points="80.8604,483.4121,70.8604,487.4121,80.8604,491.4121,76.8604,487.4121" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="74.8604" x2="365.7334" y1="487.4121" y2="487.4121"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.9912" x="115.8013" y="467.3594">Informs that the parameter code</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.1655" x="154.2141" y="482.6699">is already registered</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="10" x2="418.5249" y1="496.4121" y2="496.4121"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="277.5566" x="15" y="507.0469">[Reference values incompatible with metric type]</text><polygon fill="#475569" points="80.8604,542.9883,70.8604,546.9883,80.8604,550.9883,76.8604,546.9883" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="74.8604" x2="365.7334" y1="546.9883" y2="546.9883"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.5459" x="114.0239" y="526.9355">Informs that reference values are</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.1177" x="114.738" y="542.2461">only allowed for numeric metrics</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="10" x2="418.5249" y1="555.9883" y2="555.9883"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="150.4067" x="15" y="566.623">[Invalid reference interval]</text><polygon fill="#475569" points="80.8604,602.5645,70.8604,606.5645,80.8604,610.5645,76.8604,606.5645" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="74.8604" x2="365.7334" y1="606.5645" y2="606.5645"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.436" x="103.5789" y="586.5117">Informs that the minimum reference</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.3525" x="108.1206" y="601.8223">value cannot exceed the maximum</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="10" x2="418.5249" y1="615.5645" y2="615.5645"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="152.6304" x="15" y="626.1992">[Other invalid information]</text><polygon 