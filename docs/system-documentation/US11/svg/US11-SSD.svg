<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="563px" preserveAspectRatio="none" style="width:493px;height:563px;background:#FFFFFF;" version="1.1" viewBox="0 0 493 563" width="493px" zoomAndPan="magnify"><title>US11 - Register a Parameter</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="205.6455" x="145.5979" y="28.5352">US11 - Register a Parameter</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="231.8613" x="132.49" y="45.0234">System Sequence Diagram (SSD)</text><rect fill="none" height="91.2422" style="stroke:#000000;stroke-width:1.5;" width="477.8413" x="10" y="329.6387"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="69" x2="69" y1="135.4648" y2="482.502"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="435.2583" x2="435.2583" y1="135.4648" y2="482.502"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.7207" x="20" y="132.5117">Administrator</text><ellipse cx="69.8604" cy="67.4766" fill="#E2E2F0" rx="8" ry="8" style="stroke:#334155;stroke-width:0.5;"/><path d="M69.8604,75.4766 L69.8604,102.4766 M56.8604,83.4766 L82.8604,83.4766 M69.8604,102.4766 L56.8604,117.4766 M69.8604,102.4766 L82.8604,117.4766 " fill="none" style="stroke:#334155;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.7207" x="20" y="495.0371">Administrator</text><ellipse cx="69.8604" cy="506.4902" fill="#E2E2F0" rx="8" ry="8" style="stroke:#334155;stroke-width:0.5;"/><path d="M69.8604,514.4902 L69.8604,541.4902 M56.8604,522.4902 L82.8604,522.4902 M69.8604,541.4902 L56.8604,556.4902 M69.8604,541.4902 L82.8604,556.4902 " fill="none" style="stroke:#334155;stroke-width:0.5;"/><rect fill="#EFF6FF" height="30.4883" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="83.583" x="394.2583" y="103.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="69.583" x="401.2583" y="124.5117">UKLabsMS</text><rect fill="#EFF6FF" height="30.4883" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="83.583" x="394.2583" y="481.502"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="69.583" x="401.2583" y="502.0371">UKLabsMS</text><polygon fill="#475569" points="424.0498,162.7754,434.0498,166.7754,424.0498,170.7754,428.0498,166.7754" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="69.8604" x2="430.0498" y1="166.7754" y2="166.7754"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.439" x="105.2356" y="162.0332">The Administrator asks to register a Parameter</text><polygon fill="#475569" points="80.8604,207.3965,70.8604,211.3965,80.8604,215.3965,76.8604,211.3965" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="74.8604" x2="435.0498" y1="211.3965" y2="211.3965"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.8442" x="109.533" y="191.3438">The system requests the Parameter ID, name,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.3896" x="179.7603" y="206.6543">description, and metric</text><polygon fill="#475569" points="424.0498,236.707,434.0498,240.707,424.0498,244.707,428.0498,240.707" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="69.8604" x2="430.0498" y1="240.707" y2="240.707"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.1895" x="81.8604" y="235.9648">The Administrator provides the requested information</text><polygon fill="#475569" points="80.8604,281.3281,70.8604,285.3281,80.8604,289.3281,76.8604,285.3281" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="74.8604" x2="435.0498" y1="285.3281" y2="285.3281"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.3623" x="110.7739" y="265.2754">The system requests the metric classification</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.2681" x="177.821" y="280.5859">(Numeric or Qualitative)</text><polygon fill="#475569" points="424.0498,310.6387,434.0498,314.6387,424.0498,318.6387,428.0498,314.6387" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="69.8604" x2="430.0498" y1="314.6387" y2="314.6387"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.9482" x="94.981" y="309.8965">The Administrator selects the metric classification</text><path d="M10,329.6387 L77.1851,329.6387 L77.1851,336.9492 L67.1851,346.9492 L10,346.9492 L10,329.6387 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="91.2422" style="stroke:#000000;stroke-width:1.5;" width="477.8413" x="10" y="329.6387"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="22.1851" x="25" y="343.207">opt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="95.0039" x="92.1851" y="342.2734">[Numeric metric]</text><polygon fill="#475569" points="80.8604,379.5703,70.8604,383.5703,80.8604,387.5703,76.8604,383.5703" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="74.8604" x2="435.0498" y1="383.5703" y2="383.5703"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.7202" x="96.095" y="363.5176">The system requests the minimum and maximum</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.832" x="201.5391" y="378.8281">reference values</text><polygon fill="#475569" points="424.0498,408.8809,434.0498,412.8809,424.0498,416.8809,428.0498,412.8809" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="69.8604" x2="430.0498" y1="412.8809" y2="412.8809"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.9648" x="96.4727" y="408.1387">The Administrator provides both reference values</text><polygon fill="#475569" points="80.8604,460.502,70.8604,464.502,80.8604,468.502,76.8604,464.502" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="74.8604" x2="435.0498" y1="464.502" y2="464.502"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="303.5449" x="101.1826" y="444.4492">The system registers the Parameter and informs</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="299.5967" x="103.1567" y="459.7598">the Administrator that the operation succeeded</text><!--SRC=[bLDDRzD04BtlhnY5IoibXv0wY1wG4j9828e0jpTV9hiJPnLxryok4_ZtZ3yAJYEWsTDuvirxps_jQ6D1y9XEfp21RvJR48a1uGiobYHrvjAVqYiXfUyrEKsmifZB4AxIT7MjLDXRLpLesA3Uv-nhPzxxmZEyMhTdW0WxDFveNGvRB08D9ptxFOM0EIqAcplGvCJ10CKKAk_24sf9XJykcFqH8jT3Eh4VhROLkhZqR8XxHw-J-Unk-HVWS_jtw_NynFv2HyydVBFPpJH9Xf36JJ-yUPCayxTAORC6euKfhPDy6ULn11YWxQZgZmKOFNxyX9jmdxRpBdcbMXnCtlKDk8M77S49dy3t0QANYCxlKAb-SI8S7Lb74ResD-67AFlI-xq57rPZS5AFCsSeQBPLjDwD0Pq1GR3LBxDMiJzOOMZfUoqoODtMSuaDvqK6EsdG1OPWjrQt39cx-boNr0n4yMkDXOqoED3ropm6AaZ_Iq0fNqLuqkXV7-HSubm4oxhi0iGVJPqvfYrn-sCTi11iItfHh1iVTt16GyxyFzRkMtb-yOs_xdP2vkAPSDnXR3TyHTo60w7MciYGKRy0]--></g></svg>