t="30.4883" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="83.583" x="324.9419" y="103.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="69.583" x="331.9419" y="124.5117">UKLabsMS</text><rect fill="#EFF6FF" height="30.4883" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="83.583" x="324.9419" y="715.8496"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="69.583" x="331.9419" y="736.3848">UKLabsMS</text><polygon fill="#475569" points="354.7334,162.7754,364.7334,166.7754,354.7334,170.7754,358.7334,166.7754" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="69.8604" x2="360.7334" y1="166.7754" y2="166.7754"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.0488" x="116.7725" y="162.0332">Requests parameter registration</text><polygon fill="#475569" points="80.8604,192.0859,70.8604,196.0859,80.8604,200.0859,76.8604,196.0859" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="74.8604" x2="365.7334" y1="196.0859" y2="196.0859"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.8613" x="116.3662" y="191.3438">Requests parameter information</text><polygon fill="#475569" points="354.7334,236.707,364.7334,240.707,354.7334,244.707,358.7334,240.707" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="69.8604" x2="360.7334" y1="240.707" y2="240.707"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.9331" x="113.8303" y="220.6543">Provides code, name, description</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="67.52" x="184.5369" y="235.9648">and metric</text><polygon fill="#475569" points="80.8604,281.3281,70.8604,285.3281,80.8604,289.3281,76.8604,285.3281" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="74.8604" x2="365.7334" y1="285.3281" y2="285.3281"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.9321" x="124.8308" y="265.2754">Requests metric classification</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.9009" x="125.8464" y="280.5859">(1 - Numeric; 2 - Qualitative)</text><polygon fill="#475569" points="354.7334,325.9492,364.7334,329.9492,354.7334,333.9492,358.7334,329.9492" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="69.8604" x2="360.7334" y1="329.9492" y2="329.9492"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.2529" x="131.6704" y="309.8965">Selects metric classification</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="46.4268" x="195.0835" y="325.207">(1 or 2)</text><path d="M10,344.9492 L77.1851,344.9492 L77.1851,352.2598 L67.1851,362.2598 L10,362.2598 L10,344.9492 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="106.5527" style="stroke:#000000;stroke-width:1.5;" width="425.6553" x="10" y="344.9492"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="22.1851" x="25" y="358.5176">opt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="338.4702" x="92.1851" y="357.584">[Numeric metric (Option 1) and reference values requested]</text><polygon fill="#475569" points="80.8604,394.8809,70.8604,398.8809,80.8604,402.8809,76.8604,398.8809" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="74.8604" x2="365.7334" y1="398.8809" y2="398.8809"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.29" x="110.1519" y="378.8281">Requests minimum and maximum</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.832" x="166.8809" y="394.1387">reference values</text><polygon fill="#475569" points="354.7334,439.502,364.7334,443.502,354.7334,447.502,358.7334,443.502" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;" x1="69.8604" x2="360.7334" y1="443.502" y2="443.502"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.2466" x="112.1736" y="423.4492">Provides minimum and maximum</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.832" x="166.8809" y="438.7598">reference values</text><polygon fill="#475569" points="80.8604,475.8125,70.8604,479.8125,80.8604,483.8125,76.8604,479.8125" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="74.8604" x2="365.7334" y1="479.8125" y2="479.8125"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.873" x="81.8604" y="475.0703">Confirms successful parameter registration</text><path d="M371,492.8125 L371,701.8125 L583,701.8125 L583,502.8125 L573,492.8125 L371,492.8125 " fill="#FFF9E6" style="stroke:#181818;stroke-width:0.5;"/><path d="M573,492.8125 L573,502.8125 L583,502.8125 L573,492.8125 " fill="#FFF9E6" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="54.2598" x="377" y="510.3809">AC11-1:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.2969" x="377" y="525.6914">The parameter code must</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.7798" x="377" y="541.002">contain exactly five</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.8447" x="377" y="556.3125">alphanumeric characters</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.3872" x="377" y="571.623">and must be unique.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="377" y="586.9336">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="54.2598" x="377" y="602.2441">AC11-2:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.3037" x="377" y="617.5547">Reference values are only</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.2358" x="377" y="632.8652">applicable to numeric metrics.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="377" y="648.1758">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.9209" x="377" y="663.4863">Metric classification:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.7559" x="377" y="678.7969">1 - Numeric</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.4619" x="377" y="694.1074">2 - Qualitative (Non-numeric)</text><!--SRC=[fLLBRzim3BxhLn3TOGdG373QP6Y63KZIzh8bw-frfruOcNQ4of8doNty-z6Fh6wM1aEgaoMI7py-7LJG13Tn5C40hYbJFf23AtIO4t_TclY9NtA8wNT9HXASAynO2BquFkyBuU-KAIfjMA6yovmjJJAtsZfuTrcVZePVOs8VbCaWHUsfAsdH5-GzPZJLAZCWoJ23ZfOZNrZZDrepqlPXwfnzWE3ABXpJ3qgg0asOMPUGQnaDH-EJYzahYjlqBoulno_eJsMmxWNUoSbfD1frLIeshV3qusWqFki8bpRGR4UIpYx6Gc053aVJ95U6Q-2GhqU07keNKJmJXQERhzzmvHTnBM_g8yHx-7p8ORi5AWDnAIMd5MBEEZfb3yOJDM4OV6cPmOJRYglhWuTYqr