<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:641px;height:1233px;background:#FFFFFF;" width="641px" height="1233px" viewBox="0 0 641 1233" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="214.743" y="25.107" fill="#000" font-size="14" textLength="204.62" font-weight="700">US13 - List Employees by Role</text><text x="251.725" y="43.729" fill="#000" font-size="14" textLength="130.655" font-weight="700">Domain Model (DM)</text></g><!--class Administrator--><g class="entity" data-qualified-name="Administrator" id="ent0001" data-source-line="24"><rect x="270.939" y="65.242" width="88.469" height="36.621" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="273.939" y="85.35" fill="#000" font-size="14" textLength="82.469">Administrator</text><line x1="271.939" y1="93.863" x2="358.408" y2="93.863" style="stroke:#2563EB;stroke-width:0.5;"/></g><!--class Employee--><g class="entity" data-qualified-name="Employee" id="ent0002" data-source-line="26"><rect x="73.939" y="216.742" width="68.255" height="73.863" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="76.939" y="236.85" fill="#000" font-size="14" textLength="62.255">Employee</text><line x1="74.939" y1="245.363" x2="141.194" y2="245.363" style="stroke:#2563EB;stroke-width:0.5;"/><text x="79.939" y="264.471" fill="#000" font-size="14" textLength="30.358">code</text><text x="79.939" y="283.092" fill="#000" font-size="14" textLength="35.021">name</text></g><!--class Role--><g class="entity" data-qualified-name="Role" id="ent0003" data-source-line="31"><rect x="84.439" y="460.742" width="47.021" height="55.242" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="93.553" y="480.85" fill="#000" font-size="14" textLength="28.793">Role</text><line x1="85.439" y1="489.363" x2="130.459" y2="489.363" style="stroke:#2563EB;stroke-width:0.5;"/><text x="90.439" y="508.471" fill="#000" font-size="14" textLength="35.021">name</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="48"><path d="M177.439,179.742 L177.439,250.242 L142.329,254.242 L177.439,258.242 L177.439,328.07 A0,0 0 0 0 177.439,328.07 L382.711,328.07 A0,0 0 0 0 382.711,328.07 L382.711,189.742 L372.711,179.742 L177.439,179.742 A0,0 0 0 0 177.439,179.742" style="stroke:#181818;stroke-width:0.5;" fill="#FFF9E6"/><path d="M372.711,179.742 L372.711,189.742 L382.711,189.742 L372.711,179.742" style="stroke:#181818;stroke-width:0.5;" fill="#FFF9E6"/><text x="183.439" y="198.771" fill="#000" font-size="13" textLength="158.26">Each employee is identified</text><text x="183.439" y="216.062" fill="#000" font-size="13" textLength="156.832">by a code and has a name.</text><text x="183.439" y="233.353" fill="#000" font-size="13"> </text><text x="183.439" y="250.644" fill="#000" font-size="13" textLength="166.213">Employees can be consulted</text><text x="183.439" y="267.935" fill="#000" font-size="13" textLength="184.272">according to their assigned role.</text><text x="183.439" y="285.226" fill="#000" font-size="13"> </text><text x="183.439" y="302.517" fill="#000" font-size="13" textLength="177.049">A consultation does not modify</text><text x="183.439" y="319.808" fill="#000" font-size="13" textLength="127.899">employee information.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="59"><path d="M166.939,405.242 L166.939,484.242 L131.559,488.242 L166.939,492.242 L166.939,570.861 A0,0 0 0 0 166.939,570.861 L342.587,570.861 A0,0 0 0 0 342.587,570.861 L342.587,415.242 L332.587,405.242 L166.939,405.242 A0,0 0 0 0 166.939,405.242" style="stroke:#181818;stroke-width:0.5;" fill="#FFF9E6"/><path d="M332.587,405.242 L332.587,415.242 L342.587,415.242 L332.587,405.242" style="stroke:#181818;stroke-width:0.5;" fill="#FFF9E6"/><text x="172.939" y="424.271" fill="#000" font-size="13" textLength="153.512">Represents an employee's</text><text x="172.939" y="441.562" fill="#000" font-size="13" textLength="154.648">assigned professional role.</text><text x="172.939" y="458.853" fill="#000" font-size="13"> </text><text x="172.939" y="476.144" fill="#000" font-size="13" textLength="138.728">Several employees may</text><text x="172.939" y="493.435" fill="#000" font-size="13" textLength="118.504">share the same role.</text><text x="172.939" y="510.726" fill="#000" font-size="13"> </text><text x="172.939" y="528.017" fill="#000" font-size="13" textLength="139.483">Each employee has one</text><text x="172.939" y="545.308" fill="#000" font-size="13" textLength="112.741">assigned role in the</text><text x="172.939" y="562.599" fill="#000" font-size="13" textLength="119.222">current US13 model.</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="71"><path d="M417.939,162.242 L417.939,345.152 L626.106,345.152 L626.106,172.242 L616.106,162.242 L417.939,162.242" style="stroke:#181818;stroke-width:0.5;" fill="#FFF9E6"/><path d="M616.106,162.242 L616.106,172.242 L626.106,172.242 L616.106,162.242" style="stroke:#181818;stroke-width:1;" fill="#FFF9E6"/><text x="423.939" y="181.271" fill="#000" font-size="13" textLength="179.912">US13 - List Employees by Role</text><text x="423.939" y="198.562" fill="#000" font-size="13"> </text><text x="423.939" y="215.853" fill="#000" font-size="13" textLength="182.793">The Administrator selects a role</text><text x="423.939" y="233.144" fill="#000" font-size="13" textLength="182.095">to consult matching employees.</text><text x="423.939" y="250.435" fill="#000" font-size="13"> </text><text x="423.939" y="267.726" fill="#000" font-size="13" textLength="156.083">The consultation returns all</text><text x="423.939" y="285.017" fill="#000" font-size="13" textLength="187.167">employees assigned to that role.</text><text x="423.939" y="302.308" fill="#000" font-size="13"> </text><text x="423.939" y="319.599" fill="#000" font-size="13" textLength="134.399">If no employees match,</text><text x="423.939" y="336.89" fill="#000" font-size="13" textLength="157.517">an empty result is returned.</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="84"><path d="M10.439,631.242 L10.439,848.734 A0,0 0 0 0 10.439,848.734 L205.555,848.734 A0,0 0 0 0 205.555,848.734 L205.555,641.242 L195.555,631.242 L111.939,631.242 L107.939,516.122 L103.939,631.242 L10.439,631.242 A0,0 0 0 0 10.439,631.242" style="stroke:#181818;stroke-width:0.5;" fill="#FFF9E6"/><path d="M195.555,631.242 L195.555,641.242 L205.555,641.242 L195.555,631.242" style="stroke:#181818;stroke-width:0.5;" fill="#FFF9E6"/><text x="16.439" y="650.271" fill="#000" font-size="13" textLength="158.971">Examples of roles identified</text><text x="16.439" y="667.562" fill="#000" font-size="13" textLength="161.148">in the global Domain Model:</text><text x="16.439" y="684.853" fill="#000" font-size="13"> </text><text x="16.439" y="702.144" fill="#000" font-size="13" textLength="71.538">Receptionist</text><text x="16.439" y="719.435" fill="#000" font-size="13" textLength="129.353">MedicalLabTechnician</text><text x="16.439" y="736.726" fill="#000" font-size="13" textLength="174.116">ClinicalChemistryTechnologist</text><text x="16.439" y="754.017" fill="#000" font-size="13" textLength="93.926">SpecialistDoctor</text><text x="16.439" y="771.308" fill="#000" font-size="13" textLength="42.625">Courier</text><text x="16.439" y="788.599" fill="#000" font-size="13"> </text><text x="16.439" y="805.89" fill="#000" font-size="13" textLength="145.253">The accepted role values</text><text x="16.439" y="823.181" fill="#000" font-size="13" textLength="133.663">must be confirmed with</text><text x="16.439" y="840.472" fill="#000" font-size="13" textLength="143.793">the project requirements.</text></g><!--link Administrator to Employee--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="39" data-link-type="association"><path d="M270.789,84.242 C209.989,84.242 107.939,84.242 107.939,84.242 C107.939,84.242 107.939,166.652 107.939,216.542" style="stroke:#475569;stroke-width:1;" fill="none" id="Administrator-Employee" codeLine="39"/><polygon points="62.328,78.04,71.202,74.618,67.495,70.056,62.328,78.04" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="75.209" y="80.271" fill="#000" font-size="13" textLength="47.69">consults</text><text x="243.577" y="80.097" fill="#000" font-size="13" textLength="19.513">0..*</text><text x="87.27" y="205.468" fill="#000" font-size="13" textLength="19.513">0..*</text></g><!--link Employee to Role--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="41" data-link-type="association"><path d="M107.939,290.902 C107.939,338.042 107.939,418.262 107.939,460.442" style="stroke:#475569;stroke-width:1;" fill="none" id="Employee-Role" codeLine="41"/><polygon points="18.939,371.318,21.878,362.273,16,362.273,18.939,371.318" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="27.939" y="371.701" fill="#000" font-size="13" textLength="79.492">is assigned to</text><text x="87.387" y="312.528" fill="#000" font-size="13" textLength="19.513">0..*</text><text x="100.196" y="449.535" fill="#000" font-size="13">1</text></g><!--link Administrator to GMN12--><g class="link" data-entity-1="ent0001" data-entity-2="ent0013" id="lnk14" data-source-line="71" data-link-type="association"><path d="M314.939,102.302 C314.939,127.982 314.939,171.242 314.939,171.242 C314.939,171.242 366.289,171.242 417.829,171.242" style="stroke:#475569;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Administrator-GMN12"/></g><g class="legend" data-source-line="102"><rect x="208.547" y="869.734" width="217.013" height="345.18" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="213.547" y="889.842" fill="#000" font-size="14" textLength="137.724">US13 - Domain Model</text><text x="213.547" y="908.463" fill="#000" font-size="14"> </text><text x="213.547" y="927.084" fill="#000" font-size="14" textLength="66.145">Employee:</text><text x="213.547" y="945.705" fill="#000" font-size="14" textLength="207.013">Business concept represented by</text><text x="213.547" y="964.326" fill="#000" font-size="14" textLength="187.53">the Employee class in the CD.</text><text x="213.547" y="982.947" fill="#000" font-size="14"> </text><text x="213.547" y="1001.568" fill="#000" font-size="14" textLength="32.683">Role:</text><text x="213.547" y="1020.189" fill="#000" font-size="14" textLength="203.137">Conceptual representation of the</text><text x="213.547" y="1038.811" fill="#000" font-size="14" textLength="205.44">role attribute stored in Employee.</text><text x="213.547" y="1057.432" fill="#000" font-size="14"> </text><text x="213.547" y="1076.053" fill="#000" font-size="14" textLength="86.358">Administrator:</text><text x="213.547" y="1094.674" fill="#000" font-size="14" textLength="176.627">Primary actor represented in</text><text x="213.547" y="1113.295" fill="#000" font-size="14" textLength="106.613">the SSD and SD.</text><text x="213.547" y="1131.916" fill="#000" font-size="14"> </text><text x="213.547" y="1150.537" fill="#000" font-size="14" textLength="192.213">Technical components such as</text><text x="213.547" y="1169.158" fill="#000" font-size="14" textLength="156.42">EmployeeRepository and</text><text x="213.547" y="1187.779" fill="#000" font-size="14" textLength="160.296">ListEmployeesByRole are</text><text x="213.547" y="1206.4" fill="#000" font-size="14" textLength="137.758">intentionally excluded.</text></g><?plantuml-src fLPBZzis4BxpLmmsXxH5rqYQx1PPe0NyMY10DYZYjATSQ6fiiQ58bQIoKOlyztoa7YjjYXnidMHnEFmUCqD77GtJdxldB-YItkWG